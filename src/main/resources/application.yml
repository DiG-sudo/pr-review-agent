server:
  address: 127.0.0.1
  port: ${PR_REVIEW_SERVER_PORT:18080}

spring:
  ai:
    openai:
      # 从启动进程的环境变量读取 OpenAI 兼容服务配置。
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      chat:
        completions-path: /chat/completions
        options:
          model: ${AI_MODEL}
  datasource:
    url: ${PR_REVIEW_DB_URL:jdbc:mysql://127.0.0.1:3306/pr_review_agent}
    username: ${PR_REVIEW_DB_USERNAME:pr_agent}
    password: ${PR_REVIEW_DB_PASSWORD:pr_agent_dev}
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${PR_REVIEW_REDIS_HOST:127.0.0.1}
      port: ${PR_REVIEW_REDIS_PORT:6379}

pr-review:
  context:
    max-initial-diff-chars: ${PR_REVIEW_MAX_INITIAL_DIFF_CHARS:30000}
  execution:
    max-model-calls: ${PR_REVIEW_MAX_MODEL_CALLS:20}
    workers: ${PR_REVIEW_WORKERS:8}
    queue-capacity: ${PR_REVIEW_QUEUE_CAPACITY:64}
  events:
    publish-delay-ms: ${PR_REVIEW_PUBLISH_DELAY_MS:500}
    poll-delay-ms: ${PR_REVIEW_POLL_DELAY_MS:500}
  evaluation:
    # Development data stays outside this repository. Override these paths in
    # another machine with the corresponding environment variables.
    benchmark-workspace: ${PR_REVIEW_BENCHMARK_WORKSPACE:/Users/guodi/Desktop/java/Project01/pr-review-agent/benchmark-workspace}
    golden-comments: ${PR_REVIEW_GOLDEN_COMMENTS:/Users/guodi/Desktop/java/Project01/pr-review-agent/golden_comments}
